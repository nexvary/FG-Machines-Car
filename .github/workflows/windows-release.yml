name: FG Machines Car Stage 140000 Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stage140-cloud-release-v3-finalize
    paths:
      - 'stage140_transport_release/**'
      - 'tools/reassemble_stage140.py'
      - 'tools/apply_runtime_hotfix.py'
      - 'tools/apply_ui_diversity_hotfix.py'
      - '.github/workflows/windows-release.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fg-machines-car-stage140000-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE140_ARCHIVE_SHA256: 11448329307471388b7d49545900c8472055db18f6e4ed495f328108252898cc
  STAGE140_PROJECT_DIRNAME: FG-Machines-Car-Stage140000-CLOUD-RELEASE

jobs:
  source-audit:
    name: Source integrity + Linux release gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and verify Stage 140000 transport
        run: |
          python3 tools/reassemble_stage140.py \
            --parts-dir stage140_transport_release \
            --archive Stage140000-CLOUD-V5.tar.xz \
            --extract-dir stage140-src
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/stage140-src/${STAGE140_PROJECT_DIRNAME}" >> "$GITHUB_ENV"
          echo "${STAGE140_ARCHIVE_SHA256}  Stage140000-CLOUD-V5.tar.xz" | sha256sum -c -

      - name: Apply installed-runtime localhost hotfix R1
        run: python3 tools/apply_runtime_hotfix.py "$PROJECT_DIR"

      - name: Apply semantic UI diversity hotfix R1
        run: python3 tools/apply_ui_diversity_hotfix.py "$PROJECT_DIR"

      - name: Install Linux QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libsqlite3-dev

      - name: Function integrity audit
        run: python3 "$PROJECT_DIR/qa/function-audit.py"

      - name: Configure Linux core QA
        working-directory: ${{ env.PROJECT_DIR }}/native
        run: cmake --preset linux-core-qa --fresh

      - name: Build Linux core QA
        working-directory: ${{ env.PROJECT_DIR }}/native
        run: cmake --build --preset linux-core-qa --parallel 4

      - name: Run 40 native tests on Linux
        working-directory: ${{ env.PROJECT_DIR }}/native
        run: ctest --preset linux-core-qa --output-on-failure --parallel 4

  windows-release:
    name: Windows build + self-test + Visual QA + installer
    needs: source-audit
    runs-on: windows-2022
    timeout-minutes: 95
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reassemble and verify Stage 140000 transport
        shell: pwsh
        run: |
          python tools/reassemble_stage140.py `
            --parts-dir stage140_transport_release `
            --archive Stage140000-CLOUD-V5.tar.xz `
            --extract-dir stage140-src
          if ($LASTEXITCODE -ne 0) { throw "Transport gate failed: $LASTEXITCODE" }
          $projectDir = Join-Path $env:GITHUB_WORKSPACE "stage140-src\$env:STAGE140_PROJECT_DIRNAME"
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $actual = (Get-FileHash "Stage140000-CLOUD-V5.tar.xz" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:STAGE140_ARCHIVE_SHA256) { throw "Archive SHA256 mismatch: $actual" }
          Write-Host "WINDOWS_TRANSPORT_SHA256_PASS $actual"

      - name: Apply installed-runtime localhost hotfix R1
        shell: pwsh
        run: |
          python tools/apply_runtime_hotfix.py "$env:PROJECT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Runtime hotfix failed: $LASTEXITCODE" }

      - name: Apply semantic UI diversity hotfix R1
        shell: pwsh
        run: |
          python tools/apply_ui_diversity_hotfix.py "$env:PROJECT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "UI diversity hotfix failed: $LASTEXITCODE" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Prepare pinned vcpkg
        shell: pwsh
        run: '& "$env:PROJECT_DIR\build\cloud\prepare-vcpkg.ps1"'

      - name: Windows build + 40 tests + self-test
        shell: pwsh
        run: '& "$env:PROJECT_DIR\build\cloud\build-and-test.ps1"'

      - name: Install Visual QA dependencies
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR\qa\visual"
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Playwright Visual QA against native server
        shell: pwsh
        run: |
          & "$env:PROJECT_DIR\build\cloud\qa-server.ps1" start
          try {
            Set-Location "$env:PROJECT_DIR\qa\visual"
            npx playwright test
            if ($LASTEXITCODE -ne 0) { throw "Playwright Visual QA failed: $LASTEXITCODE" }
          }
          finally {
            & "$env:PROJECT_DIR\build\cloud\qa-server.ps1" stop
          }

      - name: Package Inno Setup release
        shell: pwsh
        run: |
          $script = Join-Path $env:PROJECT_DIR 'build\cloud\package-release.ps1'
          $text = Get-Content $script -Raw
          $oldCount = '$isccCandidates.Count'
          $newCount = '@($isccCandidates).Count'
          $oldIndex = '$isccCandidates[0]'
          $newIndex = '@($isccCandidates)[0]'
          if (-not $text.Contains($oldCount)) { throw 'Expected ISCC candidate count expression was not found' }
          if (-not $text.Contains($oldIndex)) { throw 'Expected ISCC candidate index expression was not found' }
          $text = $text.Replace($oldCount, $newCount)
          $text = $text.Replace($oldIndex, $newIndex)
          Set-Content -Path $script -Value $text -Encoding utf8
          Write-Host 'PACKAGE_RELEASE_SCALAR_FIX_APPLIED'
          & $script

      - name: Installed application startup smoke test
        shell: pwsh
        run: |
          $setup = Join-Path $env:PROJECT_DIR 'cloud-output\FG-Machines-Car-Setup.exe'
          if (!(Test-Path $setup)) { throw 'Installer missing before installed-runtime smoke test' }
          $installDir = Join-Path $env:RUNNER_TEMP 'FGMachinesCar-Installed-Runtime-Smoke'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir")
          $install = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed: $($install.ExitCode)" }
          $installedExe = Join-Path $installDir 'FG-Machines-Car.exe'
          if (!(Test-Path $installedExe)) { throw 'Installed FG-Machines-Car.exe missing' }
          if (!(Test-Path (Join-Path $installDir 'ui\index.html'))) { throw 'Installed UI payload missing' }

          $env:FG_UI_HEADLESS = '1'
          $env:FG_UI_PORT = '43901'
          $env:FG_UI_MAX_RUNTIME_SECONDS = '12'
          $app = Start-Process -FilePath $installedExe -PassThru
          $base = 'http://127.0.0.1:43901/api/status'
          $first = $null
          for ($i=0; $i -lt 80; $i++) {
            try {
              $first = Invoke-RestMethod -Uri $base -TimeoutSec 1
              if ($first.stage -eq 140000 -and $first.modules -eq 159 -and $first.readOnly -eq $true) { break }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          if ($null -eq $first -or $first.stage -ne 140000 -or $first.modules -ne 159 -or $first.readOnly -ne $true) {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            throw 'INSTALLED_RUNTIME_FIRST_PROBE_FAILED'
          }
          Start-Sleep -Seconds 5
          try { $second = Invoke-RestMethod -Uri $base -TimeoutSec 2 } catch { $second = $null }
          if ($null -eq $second -or $second.stage -ne 140000 -or $second.modules -ne 159) {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            throw 'INSTALLED_RUNTIME_PERSISTENCE_PROBE_FAILED'
          }
          Write-Host 'INSTALLED_RUNTIME_SMOKE_PASS firstProbe=true persistenceProbe=true localhostAlive=true'
          if (!$app.HasExited) {
            try { Wait-Process -Id $app.Id -Timeout 20 } catch { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }
          Remove-Item Env:FG_UI_HEADLESS -ErrorAction SilentlyContinue
          Remove-Item Env:FG_UI_PORT -ErrorAction SilentlyContinue
          Remove-Item Env:FG_UI_MAX_RUNTIME_SECONDS -ErrorAction SilentlyContinue

      - name: Normalize hardware validation to maintainer handoff
        shell: pwsh
        run: |
          $out = Join-Path $env:PROJECT_DIR 'cloud-output'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $meta = Join-Path $out 'release-metadata.json'
          if (Test-Path $meta) {
            $text = Get-Content $meta -Raw
            $text = $text -replace '\bPENDING\b','HANDOFF_TO_PROJECT_MAINTAINER'
            Set-Content -Path $meta -Value $text -Encoding utf8
          }
          @"
          # FG Machines Car — Hardware Validation Handoff

          Status: HANDOFF_TO_PROJECT_MAINTAINER
          Runtime hotfix: Stage140000-RUNTIME-HOTFIX-R1
          UI diversity hotfix: Stage140000-UI-DIVERSITY-R1
          Installed localhost startup smoke: PASS required for release
          Semantic module diversity gate: PASS required for release

          The software release gates are automated and verified in CI. The following physical-hardware validation items are explicitly transferred to the next project maintainer for continuation:

          - Real VCI interface connection and protocol validation
          - Real vehicle connection / bench validation
          - CGDI K2 SDK and physical hardware integration validation

          These items are not marked as completed by CI. They are part of the project handoff scope for the receiving maintainer.
          "@ | Set-Content -Path (Join-Path $out 'HARDWARE-HANDOFF.md') -Encoding utf8
          Write-Host 'HARDWARE_STATUS=HANDOFF_TO_PROJECT_MAINTAINER'

      - name: Optional Authenticode signing
        shell: pwsh
        run: '& "$env:PROJECT_DIR\build\cloud\sign-release.ps1"'

      - name: Refresh final installer SHA256 after signing
        shell: pwsh
        run: |
          $out = Join-Path $env:PROJECT_DIR 'cloud-output'
          $installer = Join-Path $out 'FG-Machines-Car-Setup.exe'
          if (!(Test-Path $installer)) { throw 'Final installer missing' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  FG-Machines-Car-Setup.exe" | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "FINAL_INSTALLER_SHA256=$hash"

      - name: Upload Stage 140000 Windows release
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-Car-Windows-x64-Stage140000-UI-Diversity-R1
          path: |
            ${{ env.PROJECT_DIR }}/cloud-output/FG-Machines-Car-Setup.exe
            ${{ env.PROJECT_DIR }}/cloud-output/FG-Machines-Car-Stage140000-Screenshot.png
            ${{ env.PROJECT_DIR }}/cloud-output/visual-qa-screenshots.zip
            ${{ env.PROJECT_DIR }}/cloud-output/release-metadata.json
            ${{ env.PROJECT_DIR }}/cloud-output/HARDWARE-HANDOFF.md
            ${{ env.PROJECT_DIR }}/cloud-output/SHA256SUMS.txt
            ${{ env.PROJECT_DIR }}/qa/visual/test-results/junit.xml
          if-no-files-found: error
          retention-days: 14
