name: FG Machines Car Windows Laptop Fit R3

on:
  workflow_dispatch:
  push:
    branches:
      - stage141-prehardware-coding-core
    paths:
      - 'tools/apply_laptop_156_fit.py'
      - 'tools/apply_royal_purple_ui.py'
      - 'tools/apply_andalusian_luxe_ui.py'
      - 'tools/apply_andalusian_structural_ui.py'
      - '.github/workflows/windows-laptop-fit-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/apply_laptop_156_fit.py'
      - '.github/workflows/windows-laptop-fit-release.yml'

permissions:
  contents: read

concurrency:
  group: fg-windows-laptop-fit-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE140_ARCHIVE_SHA256: 11448329307471388b7d49545900c8472055db18f6e4ed495f328108252898cc
  STAGE140_PROJECT_DIRNAME: FG-Machines-Car-Stage140000-CLOUD-RELEASE

jobs:
  windows-laptop-fit:
    name: Windows + 15.6-inch adaptive fit R3 + Installer + Visual QA
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reassemble and verify Stage 140000 source
        shell: pwsh
        run: |
          python tools/reassemble_stage140.py `
            --parts-dir stage140_transport_release `
            --archive Stage140000-CLOUD-V5.tar.xz `
            --extract-dir stage140-src
          if ($LASTEXITCODE -ne 0) { throw "Transport reassembly failed: $LASTEXITCODE" }
          $projectDir = Join-Path $env:GITHUB_WORKSPACE "stage140-src\$env:STAGE140_PROJECT_DIRNAME"
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $actual = (Get-FileHash "Stage140000-CLOUD-V5.tar.xz" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:STAGE140_ARCHIVE_SHA256) { throw "Archive SHA256 mismatch: $actual" }
          Write-Host "WINDOWS_LAPTOP_SOURCE_SHA_PASS $actual"

      - name: Apply runtime stability hotfix
        shell: pwsh
        run: |
          python tools/apply_runtime_hotfix.py "$env:PROJECT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Runtime hotfix failed: $LASTEXITCODE" }

      - name: Apply semantic UI and Andalusian V3
        shell: pwsh
        run: |
          python tools/apply_ui_diversity_hotfix.py "$env:PROJECT_DIR"
          python tools/apply_royal_purple_ui.py "$env:PROJECT_DIR"
          python tools/apply_andalusian_luxe_ui.py "$env:PROJECT_DIR"
          python tools/apply_andalusian_structural_ui.py "$env:PROJECT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Andalusian UI transformation failed: $LASTEXITCODE" }

      - name: Apply 15.6-inch adaptive Laptop Fit R3
        shell: pwsh
        run: |
          python tools/apply_laptop_156_fit.py "$env:PROJECT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Laptop fit transformation failed: $LASTEXITCODE" }
          $css = Get-Content (Join-Path $env:PROJECT_DIR 'native\ui-modern\app.css') -Raw
          if (-not $css.Contains('FG-LAPTOP-156-FIT-R3')) { throw 'Laptop Fit R3 marker missing' }
          if (-not $css.Contains('max-height:calc(100vh - 50px)')) { throw 'R3 1366x768 viewport rule missing' }
          if (-not $css.Contains('height:fit-content !important')) { throw 'R3 content-height rule missing' }
          if (-not $css.Contains('grid-auto-rows:min-content')) { throw 'R3 anti-stretch grid rule missing' }
          Write-Host 'WINDOWS_LAPTOP_FIT_R3_STATIC_GATE_PASS target=1366x768 stretched_cards=false'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Prepare pinned vcpkg
        shell: pwsh
        run: '& "$env:PROJECT_DIR\build\cloud\prepare-vcpkg.ps1"'

      - name: Build + 40 native tests + self-test
        shell: pwsh
        run: '& "$env:PROJECT_DIR\build\cloud\build-and-test.ps1"'

      - name: Install Visual QA dependencies
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR\qa\visual"
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Playwright Visual QA
        shell: pwsh
        run: |
          & "$env:PROJECT_DIR\build\cloud\qa-server.ps1" start
          try {
            Set-Location "$env:PROJECT_DIR\qa\visual"
            npx playwright test
            if ($LASTEXITCODE -ne 0) { throw "Playwright Visual QA failed: $LASTEXITCODE" }
          }
          finally {
            & "$env:PROJECT_DIR\build\cloud\qa-server.ps1" stop
          }

      - name: Package Windows Laptop Fit R3 installer
        shell: pwsh
        run: |
          $script = Join-Path $env:PROJECT_DIR 'build\cloud\package-release.ps1'
          $text = Get-Content $script -Raw
          if ($text.Contains('$isccCandidates.Count')) { $text = $text.Replace('$isccCandidates.Count','@($isccCandidates).Count') }
          if ($text.Contains('$isccCandidates[0]')) { $text = $text.Replace('$isccCandidates[0]','@($isccCandidates)[0]') }
          Set-Content -Path $script -Value $text -Encoding utf8
          & $script
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed: $LASTEXITCODE" }

      - name: Strict visual acceptance at 1366x768
        shell: pwsh
        run: |
          $out = Join-Path $env:PROJECT_DIR 'cloud-output'
          $shotDir = Join-Path $env:PROJECT_DIR 'qa\visual\laptop-fit-r3-shots'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          & "$env:PROJECT_DIR\build\cloud\qa-server.ps1" start
          try {
            Set-Location "$env:PROJECT_DIR\qa\visual"
            @'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          function gateInPage(){
            const main = document.querySelector('main,.main-content,.workspace-content,.page-content,.content');
            const sidebar = document.querySelector('.fg-v3-sidebar,aside,.sidebar,[class*="sidebar"]');
            const visible = el => {
              const r=el.getBoundingClientRect();
              const s=getComputedStyle(el);
              return r.width>1 && r.height>1 && s.display!=='none' && s.visibility!=='hidden';
            };
            const candidates = main ? [...main.querySelectorAll('.fg-ornate-frame,.card,.panel,section,article,[class*="card"]')] : [];
            const sparse=[];
            for(const el of candidates){
              if(!visible(el)) continue;
              if(el.parentElement && candidates.includes(el.parentElement)) continue;
              const r=el.getBoundingClientRect();
              if(r.height < 300) continue;
              let contentBottom=r.top;
              const nodes=[...el.querySelectorAll('*')].filter(n =>
                visible(n) && !n.matches('.fg-corner,.fg-crest,.fg-header-crest') &&
                !n.closest('.fg-corner,.fg-crest,.fg-header-crest'));
              for(const n of nodes){
                const nr=n.getBoundingClientRect();
                if(n.textContent.trim() || ['BUTTON','A','INPUT','SELECT','TEXTAREA','TABLE','CANVAS','SVG','IMG'].includes(n.tagName))
                  contentBottom=Math.max(contentBottom,nr.bottom);
              }
              const waste=Math.max(0,r.bottom-contentBottom);
              if(r.height>330 && waste>170) sparse.push({h:Math.round(r.height),waste:Math.round(waste),cls:String(el.className).slice(0,120)});
            }
            return {
              vw:innerWidth,vh:innerHeight,
              bodyW:document.body.scrollWidth,bodyH:document.body.scrollHeight,
              main:main?{clientHeight:main.clientHeight,scrollHeight:main.scrollHeight,overflowY:getComputedStyle(main).overflowY}:null,
              sidebar:sidebar?{clientHeight:sidebar.clientHeight,scrollHeight:sidebar.scrollHeight}:null,
              sparse
            };
          }

          async function validate(page,label){
            const fit=await page.evaluate(gateInPage);
            console.log(label,JSON.stringify(fit));
            if(fit.vw!==1366 || fit.vh!==768) throw new Error(`${label}: wrong viewport`);
            if(fit.bodyW > fit.vw+4) throw new Error(`${label}: horizontal clipping ${fit.bodyW}/${fit.vw}`);
            if(!fit.main) throw new Error(`${label}: main content not found`);
            if(!['auto','scroll'].includes(fit.main.overflowY)) throw new Error(`${label}: main not scrollable`);
            if(fit.sparse.length) throw new Error(`${label}: stretched sparse panels ${JSON.stringify(fit.sparse.slice(0,4))}`);
            await page.evaluate(()=>{const m=document.querySelector('main,.main-content,.workspace-content,.page-content,.content');if(m)m.scrollTop=m.scrollHeight;});
            await page.waitForTimeout(150);
            const bottomReachable=await page.evaluate(()=>{
              const m=document.querySelector('main,.main-content,.workspace-content,.page-content,.content');
              return !m || (m.scrollTop+m.clientHeight >= m.scrollHeight-6);
            });
            if(!bottomReachable) throw new Error(`${label}: bottom content not reachable`);
            await page.evaluate(()=>{const m=document.querySelector('main,.main-content,.workspace-content,.page-content,.content');if(m)m.scrollTop=0;});
          }

          (async()=>{
            const out=process.env.FG_LAPTOP_OUT;
            fs.mkdirSync(out,{recursive:true});
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            await page.goto('http://127.0.0.1:43890/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('body',{state:'visible',timeout:10000});
            await page.waitForTimeout(1200);
            await validate(page,'R3_HOME');
            const homeShot=path.resolve(out,'FG-Machines-Car-Windows-Laptop-R3-1366x768.png');
            await page.screenshot({path:homeShot,fullPage:false});

            const first=page.locator('main a[href*="modules"],main a[href*="m0"],.module-card a,.card a').first();
            if(await first.count()){
              await first.click();
              await page.waitForTimeout(700);
            } else {
              await page.goto('http://127.0.0.1:43890/modules/m001.html',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('body',{state:'visible',timeout:10000});
              await page.waitForTimeout(700);
            }
            await validate(page,'R3_MODULE');
            const moduleShot=path.resolve(out,'FG-Machines-Car-Windows-Module-R3-1366x768.png');
            await page.screenshot({path:moduleShot,fullPage:false});
            if(!fs.existsSync(homeShot)||!fs.existsSync(moduleShot)) throw new Error('R3 screenshots missing');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content -Path windows-laptop-fit-r3-check.cjs -Encoding utf8
            $env:FG_LAPTOP_OUT = $shotDir
            node windows-laptop-fit-r3-check.cjs
            if ($LASTEXITCODE -ne 0) { throw "R3 1366x768 visual gate failed: $LASTEXITCODE" }
            Copy-Item (Join-Path $shotDir 'FG-Machines-Car-Windows-Laptop-R3-1366x768.png') (Join-Path $out 'FG-Machines-Car-Windows-Laptop-R3-1366x768.png') -Force
            Copy-Item (Join-Path $shotDir 'FG-Machines-Car-Windows-Module-R3-1366x768.png') (Join-Path $out 'FG-Machines-Car-Windows-Module-R3-1366x768.png') -Force
            Write-Host 'WINDOWS_LAPTOP_FIT_R3_VISUAL_GATE_PASS sparse_panels=0 bottom_reachable=true'
          }
          finally {
            & "$env:PROJECT_DIR\build\cloud\qa-server.ps1" stop
          }

      - name: Verify Windows Laptop Fit R3 release
        shell: pwsh
        run: |
          $out = Join-Path $env:PROJECT_DIR 'cloud-output'
          $setup = Join-Path $out 'FG-Machines-Car-Setup.exe'
          $shot = Join-Path $out 'FG-Machines-Car-Windows-Laptop-R3-1366x768.png'
          $moduleShot = Join-Path $out 'FG-Machines-Car-Windows-Module-R3-1366x768.png'
          if (!(Test-Path $setup)) { throw 'Installer missing' }
          if (!(Test-Path $shot)) { throw 'R3 home screenshot missing' }
          if (!(Test-Path $moduleShot)) { throw 'R3 module screenshot missing' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  FG-Machines-Car-Setup.exe" | Set-Content (Join-Path $out 'WINDOWS-LAPTOP-FIT-R3-SHA256SUMS.txt') -Encoding ascii
          @"
          FG Machines Car - Windows Laptop Fit R3
          Target viewport: 1366x768 strict PASS
          Sparse stretched panels: 0 required
          Bottom results reachable: required
          Horizontal clipping: forbidden
          Sidebar independent scroll: enabled
          Andalusian Structural V3: enabled
          Native tests: 40/40 PASS required
          Playwright Visual QA: PASS required
          Hardware/vehicle validation: not claimed
          "@ | Set-Content (Join-Path $out 'WINDOWS-LAPTOP-FIT-R3-RELEASE.txt') -Encoding utf8
          Write-Host "WINDOWS_LAPTOP_FIT_R3_INSTALLER_PASS SHA256=$hash"

      - name: Upload Windows Laptop Fit R3 release
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-Car-Windows-Laptop-Fit-R3
          path: |
            ${{ env.PROJECT_DIR }}/cloud-output/FG-Machines-Car-Setup.exe
            ${{ env.PROJECT_DIR }}/cloud-output/FG-Machines-Car-Windows-Laptop-R3-1366x768.png
            ${{ env.PROJECT_DIR }}/cloud-output/FG-Machines-Car-Windows-Module-R3-1366x768.png
            ${{ env.PROJECT_DIR }}/cloud-output/visual-qa-screenshots.zip
            ${{ env.PROJECT_DIR }}/cloud-output/WINDOWS-LAPTOP-FIT-R3-RELEASE.txt
            ${{ env.PROJECT_DIR }}/cloud-output/WINDOWS-LAPTOP-FIT-R3-SHA256SUMS.txt
            ${{ env.PROJECT_DIR }}/qa/visual/test-results/junit.xml
          if-no-files-found: error
          retention-days: 14
