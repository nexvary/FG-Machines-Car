name: FG Machines Car Ubuntu 24.04 R4 Navigation Gated Release

on:
  workflow_dispatch:
  push:
    branches:
      - stage141-prehardware-coding-core
    paths:
      - 'tools/navigation_integrity_gate.cjs'
      - 'tools/apply_navigation_integrity_hotfix.py'
      - 'tools/laptop_fit_gate.cjs'
      - 'tools/apply_laptop_156_fit.py'
      - 'tools/apply_ubuntu24_port.py'
      - 'tools/apply_ubuntu24_branding.py'
      - 'tools/apply_runtime_hotfix.py'
      - 'tools/apply_ui_diversity_hotfix.py'
      - 'tools/apply_royal_purple_ui.py'
      - 'tools/apply_andalusian_luxe_ui.py'
      - 'tools/apply_andalusian_structural_ui.py'
      - '.github/workflows/ubuntu24-navigation-gated-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/navigation_integrity_gate.cjs'
      - 'tools/apply_navigation_integrity_hotfix.py'
      - 'tools/laptop_fit_gate.cjs'
      - 'tools/apply_laptop_156_fit.py'
      - 'tools/apply_ubuntu24_port.py'
      - 'tools/apply_ubuntu24_branding.py'
      - '.github/workflows/ubuntu24-navigation-gated-release.yml'

permissions:
  contents: read

concurrency:
  group: fg-ubuntu24-r4-navigation-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE140_ARCHIVE_SHA256: 11448329307471388b7d49545900c8472055db18f6e4ed495f328108252898cc
  STAGE140_PROJECT_DIRNAME: FG-Machines-Car-Stage140000-CLOUD-RELEASE
  DEB_NAME: fg-machines-car_1.40.0-ubuntu24.4_amd64.deb

jobs:
  ubuntu24-r4:
    name: Ubuntu 24.04 R4 + Navigation Integrity + 1366x768 + DEB
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reassemble and verify Stage 140000 source
        shell: bash
        run: |
          python3 tools/reassemble_stage140.py \
            --parts-dir stage140_transport_release \
            --archive Stage140000-CLOUD-V5.tar.xz \
            --extract-dir stage140-src
          actual=$(sha256sum Stage140000-CLOUD-V5.tar.xz | awk '{print $1}')
          test "$actual" = "$STAGE140_ARCHIVE_SHA256"
          PROJECT_DIR="$GITHUB_WORKSPACE/stage140-src/$STAGE140_PROJECT_DIRNAME"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROJECT_DIR/ubuntu-output"
          echo "UBUNTU_OUT=$PROJECT_DIR/ubuntu-output" >> "$GITHUB_ENV"
          echo "UBUNTU24_R4_SOURCE_SHA_PASS $actual"

      - name: Apply runtime, semantic UI, navigation connectivity, Andalusian V3 and Laptop Fit R3
        shell: bash
        run: |
          python3 tools/apply_runtime_hotfix.py "$PROJECT_DIR"
          python3 tools/apply_ui_diversity_hotfix.py "$PROJECT_DIR"
          python3 tools/apply_navigation_integrity_hotfix.py "$PROJECT_DIR"
          python3 tools/apply_royal_purple_ui.py "$PROJECT_DIR"
          python3 tools/apply_andalusian_luxe_ui.py "$PROJECT_DIR"
          python3 tools/apply_andalusian_structural_ui.py "$PROJECT_DIR"
          python3 tools/apply_laptop_156_fit.py "$PROJECT_DIR"
          grep -q 'FG-NAVIGATION-INTEGRITY-HOTFIX-R1' "$PROJECT_DIR/native/ui-modern/app.css"
          grep -q 'FG-ANDALUSIAN-STRUCTURAL-V3' "$PROJECT_DIR/native/ui-modern/app.css"
          grep -q 'FG-LAPTOP-156-FIT-R3' "$PROJECT_DIR/native/ui-modern/app.css"
          test -f "$PROJECT_DIR/native/ui-modern/services.html"
          test -f "$PROJECT_DIR/native/ui-modern/about.html"
          echo 'UBUNTU24_R4_UI_STATIC_GATE_PASS navigation_connectivity=true'

      - name: Apply Ubuntu 24.04 native modern host and branding
        shell: bash
        run: |
          python3 tools/apply_ubuntu24_port.py "$PROJECT_DIR"
          python3 tools/apply_ubuntu24_branding.py "$PROJECT_DIR"
          grep -q 'FG-UBUNTU24-MODERN-HOST-V1' "$PROJECT_DIR/native/CMakeLists.txt"
          grep -q 'Ubuntu 24.04 Native Core' "$PROJECT_DIR/native/ui-modern/index.html"
          if grep -R -n 'Windows Native Core' "$PROJECT_DIR/native/ui-modern"; then
            echo 'Windows Native Core label still present in Linux UI' >&2
            exit 1
          fi

      - name: Install Ubuntu build and browser dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config libsqlite3-dev libssl-dev \
            google-chrome-stable curl desktop-file-utils dpkg-dev
          google-chrome --version || google-chrome-stable --version

      - name: Configure Ubuntu native build
        shell: bash
        run: |
          BUILD="$PROJECT_DIR/native/build-ubuntu24-r4"
          echo "BUILD_DIR=$BUILD" >> "$GITHUB_ENV"
          cmake -S "$PROJECT_DIR/native" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFG_BUILD_QT_UI=OFF \
            -DFG_BUILD_WIN32_UI=OFF \
            -DFG_BUILD_MODERN_UI=ON \
            -DFG_BUILD_TESTS=ON

      - name: Build + 40 native tests + self-test
        shell: bash
        env:
          FG_BROWSER: /usr/bin/google-chrome
        run: |
          cmake --build "$BUILD_DIR" --parallel 2
          test -x "$BUILD_DIR/FG-Machines-Car"
          test -f "$BUILD_DIR/ui/index.html"
          grep -q 'Ubuntu 24.04 Native Core' "$BUILD_DIR/ui/index.html"
          grep -q 'FG-LAPTOP-156-FIT-R3' "$BUILD_DIR/ui/app.css"
          ctest --test-dir "$BUILD_DIR" --output-on-failure --output-junit "$UBUNTU_OUT/ctest-ubuntu24-r4.xml"
          "$BUILD_DIR/FG-Machines-Car" --self-test
          echo 'UBUNTU24_R4_NATIVE_BUILD_TEST_SELFTEST_PASS'

      - name: Install patched browser QA dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR/qa/visual"
          npm install --no-audit --no-fund
          npm install --save-dev --save-exact @playwright/test@1.63.0 playwright@1.63.0 --no-audit --no-fund
          npx playwright install chromium
          pw=$(node -p "require('playwright/package.json').version")
          test "$pw" = '1.63.0'
          echo "PATCHED_PLAYWRIGHT_ACTIVE version=$pw"

      - name: Known dependency vulnerability gate
        shell: bash
        run: |
          cd "$PROJECT_DIR/qa/visual"
          npm audit --audit-level=high
          echo 'KNOWN_DEPENDENCY_VULNERABILITY_GATE_PASS high_or_critical=0'

      - name: Start native Ubuntu QA server
        shell: bash
        run: |
          READY="$RUNNER_TEMP/fg-ubuntu24-r4-ready"
          rm -f "$READY"
          FG_QA_READY_FILE="$READY" "$BUILD_DIR/FG-Machines-Car" --qa-server >"$UBUNTU_OUT/qa-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fg-ubuntu24-r4-qa.pid"
          for i in $(seq 1 120); do
            [ -s "$READY" ] && break
            sleep 0.1
          done
          test -s "$READY"
          curl --fail --silent http://127.0.0.1:43890/api/status | tee "$UBUNTU_OUT/api-status.json"

      - name: Visual QA + Navigation Integrity Gate + Laptop Fit Gate
        shell: bash
        env:
          FG_QA_URL: http://127.0.0.1:43890/
        run: |
          cd "$PROJECT_DIR/qa/visual"
          npx playwright test

          export FG_UI_ROOT="$PROJECT_DIR/native/ui-modern"
          export FG_NAV_REPORT="$UBUNTU_OUT/NAVIGATION-INTEGRITY-REPORT.json"
          node "$GITHUB_WORKSPACE/tools/navigation_integrity_gate.cjs"

          node -e "const r=require(process.env.FG_NAV_REPORT); if(!r.summary.pass) process.exit(1); if(r.summary.orphanPages!==0) process.exit(2); if(r.summary.brokenHttpLinks!==0) process.exit(3); console.log('NAVIGATION_REPORT_ASSERT_PASS pages='+r.summary.pagesVisited+' links='+r.summary.internalLinkOccurrences+' clicked='+r.summary.uniqueTargetsClicked)"

          export FG_LAPTOP_OUT="$UBUNTU_OUT"
          export FG_LAPTOP_PREFIX='FG-Machines-Car-Ubuntu24'
          node "$GITHUB_WORKSPACE/tools/laptop_fit_gate.cjs"

          echo 'UBUNTU24_R4_VISUAL_NAVIGATION_LAPTOP_GATES_PASS'

      - name: Stop Ubuntu QA server
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/fg-ubuntu24-r4-qa.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/fg-ubuntu24-r4-qa.pid")" 2>/dev/null || true
          fi

      - name: Build Ubuntu 24.04 R4 DEB only after all gates pass
        shell: bash
        run: |
          PKG="$RUNNER_TEMP/fg-machines-car-r4-deb"
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" \
                   "$PKG/opt/fg-machines-car" \
                   "$PKG/usr/bin" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/scalable/apps"

          cp "$BUILD_DIR/FG-Machines-Car" "$PKG/opt/fg-machines-car/FG-Machines-Car"
          cp -a "$BUILD_DIR/ui" "$PKG/opt/fg-machines-car/ui"
          chmod 0755 "$PKG/opt/fg-machines-car/FG-Machines-Car"

          cat > "$PKG/usr/bin/fg-machines-car" <<'EOF'
          #!/bin/sh
          exec /opt/fg-machines-car/FG-Machines-Car "$@"
          EOF
          chmod 0755 "$PKG/usr/bin/fg-machines-car"

          cp "$BUILD_DIR/ui/fg-icon.svg" "$PKG/usr/share/icons/hicolor/scalable/apps/fg-machines-car.svg"
          cat > "$PKG/usr/share/applications/fg-machines-car.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=FG Machines Car
          Comment=Automotive diagnostics workspace for Ubuntu 24.04
          Exec=fg-machines-car
          Icon=fg-machines-car
          Terminal=false
          Categories=Utility;Engineering;
          StartupNotify=true
          EOF
          desktop-file-validate "$PKG/usr/share/applications/fg-machines-car.desktop"

          cat > "$PKG/DEBIAN/control" <<'EOF'
          Package: fg-machines-car
          Version: 1.40.0-ubuntu24.4
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: FG Machines <info@nexvary.com>
          Depends: libc6 (>= 2.39), libstdc++6, libssl3t64, libsqlite3-0
          Recommends: google-chrome-stable | chromium-browser
          Description: FG Machines Car automotive diagnostics workspace
           Ubuntu 24.04 LTS R4 build with Navigation Integrity Gate and 1366x768 laptop fit.
           Current validated software scope remains READ ONLY diagnostics.
          EOF

          dpkg-deb --build --root-owner-group "$PKG" "$UBUNTU_OUT/$DEB_NAME"
          dpkg-deb --info "$UBUNTU_OUT/$DEB_NAME"
          echo 'UBUNTU24_R4_DEB_BUILD_PASS'

      - name: Install DEB and run packaged self-test
        shell: bash
        env:
          FG_BROWSER: /usr/bin/google-chrome
        run: |
          sudo dpkg -i "$UBUNTU_OUT/$DEB_NAME"
          test -x /opt/fg-machines-car/FG-Machines-Car
          test -f /opt/fg-machines-car/ui/index.html
          grep -q 'Ubuntu 24.04 Native Core' /opt/fg-machines-car/ui/index.html
          grep -q 'FG-LAPTOP-156-FIT-R3' /opt/fg-machines-car/ui/app.css
          /opt/fg-machines-car/FG-Machines-Car --self-test
          command -v fg-machines-car
          echo 'UBUNTU24_R4_DEB_INSTALL_SELFTEST_PASS'

      - name: Verify gated Ubuntu R4 release and checksums
        shell: bash
        run: |
          test -s "$UBUNTU_OUT/$DEB_NAME"
          test -s "$UBUNTU_OUT/FG-Machines-Car-Ubuntu24-Laptop-R4-1366x768.png"
          test -s "$UBUNTU_OUT/FG-Machines-Car-Ubuntu24-Module-R4-1366x768.png"
          test -s "$UBUNTU_OUT/NAVIGATION-INTEGRITY-REPORT.json"

          cd "$UBUNTU_OUT"
          sha256sum "$DEB_NAME" \
            FG-Machines-Car-Ubuntu24-Laptop-R4-1366x768.png \
            FG-Machines-Car-Ubuntu24-Module-R4-1366x768.png \
            NAVIGATION-INTEGRITY-REPORT.json > UBUNTU24-R4-SHA256SUMS.txt

          cat > UBUNTU24-R4-RELEASE.txt <<'EOF'
          FG Machines Car - Ubuntu 24.04 LTS R4 Navigation Gated
          Architecture: amd64
          Native core: C++20 POSIX/Linux
          UI host: Chrome/Chromium app mode
          UI: Royal Purple + Gold + Andalusian Structural V3
          Target viewport: 1366x768 strict PASS required
          Navigation Integrity Gate: PASS required before packaging
          Home / Services / About: real click validation required
          Every HTML page: reachable from navigation graph required
          Every internal link: HTTP validation required
          Every unique internal page target: real click validation required
          Orphan/disconnected pages: 0 required
          Broken internal links: 0 required
          Browser page exceptions/console errors: 0 required
          Known high/critical npm dependency vulnerabilities: 0 required
          Native tests: 40/40 PASS required
          Hardware/vehicle validation: not claimed
          EOF
          echo 'UBUNTU24_R4_GATED_RELEASE_PASS'

      - name: Upload Ubuntu 24.04 R4 gated release
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-Car-Ubuntu24-Laptop-Fit-R4-Navigation-Gated
          path: |
            ${{ env.UBUNTU_OUT }}/${{ env.DEB_NAME }}
            ${{ env.UBUNTU_OUT }}/FG-Machines-Car-Ubuntu24-Laptop-R4-1366x768.png
            ${{ env.UBUNTU_OUT }}/FG-Machines-Car-Ubuntu24-Module-R4-1366x768.png
            ${{ env.UBUNTU_OUT }}/NAVIGATION-INTEGRITY-REPORT.json
            ${{ env.UBUNTU_OUT }}/UBUNTU24-R4-RELEASE.txt
            ${{ env.UBUNTU_OUT }}/UBUNTU24-R4-SHA256SUMS.txt
            ${{ env.UBUNTU_OUT }}/ctest-ubuntu24-r4.xml
            ${{ env.UBUNTU_OUT }}/qa-server.log
          if-no-files-found: error
          retention-days: 14
